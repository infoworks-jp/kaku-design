<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中央経理センター</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06101e;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .content-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      color: #ffffff;
      pointer-events: none;
      width: 90%;
      max-width: 800px;
    }
    h1.main-title {
      font-size: 3rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
      display: inline-block;
    }
    p.sub-text {
      font-size: 1.2rem;
      letter-spacing: 0.15em;
      line-height: 1.8;
      color: rgba(225, 240, 255, 0.9);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }
    /* 1文字ごとのゆらぎと波紋連動アニメーション */
    .yuragi-char {
      display: inline-block;
      opacity: 0;
      transform: translateY(15px) scale(0.9);
      filter: blur(8px);
      animation: waterEmerge 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    @keyframes waterEmerge {
      0% {
        opacity: 0;
        transform: translateY(15px) scale(0.8);
        filter: blur(10px);
      }
      50% {
        opacity: 0.8;
        filter: blur(2px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="content-overlay">
    <h1 class="main-title" id="title-text">中央経理センター</h1>
    <p class="sub-text" id="sub-text">信頼と実績でビジネスの未来をサポートします</p>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- 1. 文字のゆらぎアニメーション適用スクリプト ---
    function applyYuragiEffect(elementId, baseDelay = 0) {
      const el = document.getElementById(elementId);
      const text = el.textContent;
      el.textContent = '';
      
      Array.from(text).forEach((char, index) => {
        const span = document.createElement('span');
        span.textContent = char === ' ' ? '\u00A0' : char;
        span.className = 'yuragi-char';
        span.style.animationDelay = `${baseDelay + (index * 0.08)}s`;
        el.appendChild(span);
      });
    }

    applyYuragiEffect('title-text', 0.2);
    applyYuragiEffect('sub-text', 1.0);

    // --- 2. Three.js 水面シミュレーション ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -30, 25);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 光源設定
    const ambientLight = new THREE.AmbientLight(0x0a192f, 1.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x38bdf8, 2.0);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    // 水面メッシュ（PlaneGeometry）
    const geometry = new THREE.PlaneGeometry(60, 60, 128, 128);
    const material = new THREE.MeshPhongMaterial({
      color: 0x0a192f,
      emissive: 0x0284c7,
      specular: 0x38bdf8,
      shininess: 100,
      wireframe: false,
      flatShading: true,
      transparent: true,
      opacity: 0.9
    });

    const waterMesh = new THREE.Mesh(geometry, material);
    scene.add(waterMesh);

    // 波紋の動的頂点計算
    const pos = geometry.attributes.position;
    const count = pos.count;

    let ripples = [];

    function addRipple(x, y) {
      ripples.push({
        x: x,
        y: y,
        time: 0,
        amplitude: 1.5
      });
      if (ripples.length > 8) ripples.shift();
    }

    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = -(e.clientY / window.innerHeight) * 2 + 1;
      
      const worldX = x * 25;
      const worldY = y * 25;
      
      addRipple(worldX, worldY);
    });

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      for (let i = 0; i < count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);

        let z = Math.sin(vx * 0.2 + time * 1.5) * 0.3 + Math.cos(vy * 0.2 + time * 1.5) * 0.3;

        ripples.forEach(r => {
          const dx = vx - r.x;
          const dy = vy - r.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist < r.time * 8 && dist > (r.time * 8 - 4)) {
            const wave = Math.sin((dist - r.time * 8) * 2.0);
            z += wave * r.amplitude * Math.max(0, 1 - r.time / 2.0);
          }
        });

        pos.setZ(i, z);
      }

      ripples.forEach(r => r.time += 0.03);
      ripples = ripples.filter(r => r.time < 2.0);

      pos.needsUpdate = true;
      geometry.computeVertexNormals();

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
