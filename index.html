<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中央経理センター</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Monospace; }
    #container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    /* 中央テキストオーバーレイ */
    .content-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      color: #ffffff;
      pointer-events: none;
      width: 90%;
      max-width: 800px;
    }
    h1.main-title {
      font-size: 3.2rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 0 10px rgba(56, 189, 248, 0.6);
    }
    p.sub-text {
      font-size: 1.25rem;
      letter-spacing: 0.18em;
      line-height: 1.8;
      color: rgba(230, 245, 255, 0.95);
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 0 8px rgba(56, 189, 248, 0.4);
    }
    /* lil-guiの調整 */
    .lil-gui.root { z-index: 20 !important; top: 10px; right: 10px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="container"></div>

  <div class="content-overlay">
    <h1 class="main-title">中央経理センター</h1>
    <p class="sub-text">信頼と実績でビジネスの未来をサポートします</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
    import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';
    import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';

    // Texture width for simulation
    const WIDTH = 128;

    // Water size in world units
    const BOUNDS = 512;
    const BOUNDS_HALF = BOUNDS / 2;

    let container;
    let camera, scene, renderer;
    let mouseMoved = false;
    const mouseCoords = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();

    let waterMesh;
    let meshRay;
    let gpuCompute;
    let heightmapVariable;
    let waterUniforms;
    let smoothWaterUniforms;
    let readWaterUniforms;
    let readWaterShader;

    // lil-gui
    const effectController = {
      mouseSize: 20.0,
      viscosity: 0.98,
      waveHeight: 0.3,
    };

    const simplex = new SimplexNoise();

    init();
    animate();

    function init() {
      container = document.getElementById( 'container' );

      camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 1, 3000 );
      camera.position.set( 0, 200, 350 );
      camera.lookAt( 0, 0, 0 );

      scene = new THREE.Scene();
      scene.background = new THREE.Color( 0xa0a0a0 );

      const sun = new THREE.DirectionalLight( 0xFFFFFF, 3.0 );
      sun.position.set( 300, 400, 300 );
      scene.add( sun );

      const ambient = new THREE.AmbientLight( 0x888888 );
      scene.add( ambient );

      renderer = new THREE.WebGLRenderer( { antialias: true } );
      renderer.setPixelRatio( window.devicePixelRatio );
      renderer.setSize( window.innerWidth, window.innerHeight );
      container.appendChild( renderer.domElement );

      initWater();
      initGUI();

      window.addEventListener( 'resize', onWindowResize );
      window.addEventListener( 'pointermove', onPointerMove );
    }

    function initWater() {
      const materialColor = 0x004466;

      const geometry = new THREE.PlaneGeometry( BOUNDS, BOUNDS, WIDTH - 1, WIDTH - 1 );

      // Material for water surface
      waterUniforms = {
        'color': { value: new THREE.Color( materialColor ) },
        'heightmap': { value: null }
      };

      const waterMaterial = new THREE.ShaderMaterial({
        uniforms: waterUniforms,
        vertexShader: `
          uniform sampler2D heightmap;
          varying vec3 vNormal;
          varying vec3 vViewPosition;

          void main() {
            vec4 heightmapValue = texture2D( heightmap, uv );
            vec3 transformed = vec3( position.x, position.y, heightmapValue.r );

            vec2 du = vec2( 1.0 / 128.0, 0.0 );
            vec2 dv = vec2( 0.0, 1.0 / 128.0 );
            float c = heightmapValue.r;
            float r = texture2D( heightmap, uv + du ).r;
            float t = texture2D( heightmap, uv + dv ).r;
            vNormal = normalize( vec3( c - r, c - t, 1.0 ) );

            vec4 mvPosition = modelViewMatrix * vec4( transformed, 1.0 );
            vViewPosition = - mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 color;
          varying vec3 vNormal;
          varying vec3 vViewPosition;

          void main() {
            vec3 normal = normalize( vNormal );
            vec3 lightDir = normalize( vec3( 0.5, 1.0, 0.75 ) );
            float diff = max( dot( normal, lightDir ), 0.2 );
            vec3 reflectDir = reflect( -lightDir, normal );
            float spec = pow( max( dot( normalize( vViewPosition ), reflectDir ), 0.0 ), 16.0 );
            gl_FragColor = vec4( color * diff + vec3(0.4, 0.6, 0.8) * spec, 0.85 );
          }`,
        transparent: true
      });

      // 修正: 二重定義を削除
      waterMesh = new THREE.Mesh( geometry, waterMaterial );
      waterMesh.rotation.x = - Math.PI / 2;
      scene.add( waterMesh );

      // Mesh for raycasting
      const geometryRay = new THREE.PlaneGeometry( BOUNDS, BOUNDS, 1, 1 );
      meshRay = new THREE.Mesh( geometryRay, new THREE.MeshBasicMaterial( { visible: false } ) );
      meshRay.rotation.x = - Math.PI / 2;
      scene.add( meshRay );

      // GPGPU compute renderer
      gpuCompute = new GPUComputationRenderer( WIDTH, WIDTH, renderer );

      if ( renderer.capabilities.isWebGL2 === false ) {
        gpuCompute.setDataType( THREE.HalfFloatType );
      }

      const heightmap0 = gpuCompute.createTexture();
      fillTexture( heightmap0 );

      heightmapVariable = gpuCompute.addVariable( 'heightmap', `
        uniform vec2 mousePos;
        uniform float mouseSize;
        uniform float viscosityConstant;
        varying vec2 vUv;

        void main() {
          vec2 cellSize = vec2( 1.0 / 128.0 );
          vec4 heightmapValue = texture2D( heightmap, vUv );

          // 計算 (波動方程式)
          float north = texture2D( heightmap, vUv + vec2( 0.0, cellSize.y ) ).r;
          float south = texture2D( heightmap, vUv + vec2( 0.0, - cellSize.y ) ).r;
          float east = texture2D( heightmap, vUv + vec2( cellSize.x, 0.0 ) ).r;
          float west = texture2D( heightmap, vUv + vec2( - cellSize.x, 0.0 ) ).r;

          float newHeight = ( north + south + east + west ) * 0.5 - heightmapValue.g;
          newHeight *= viscosityConstant;

          // マウス入力
          if (mousePos.x >= 0.0) {
            float phase = distance( vUv, mousePos );
            if ( phase < mouseSize ) {
              newHeight += (1.0 - phase / mouseSize) * 2.0;
            }
          }

          // Rチャンネル: 新しい高さ / Gチャンネル: 過去の高さ（減衰用）
          gl_FragColor = vec4( newHeight, heightmapValue.r, 0.0, 1.0 );
        }
      `, heightmap0 );

      gpuCompute.setVariableDependencies( heightmapVariable, [ heightmapVariable ] );

      heightmapVariable.material.uniforms[ 'mousePos' ] = { value: new THREE.Vector2( -1, -1 ) };
      heightmapVariable.material.uniforms[ 'mouseSize' ] = { value: 0.05 };
      heightmapVariable.material.uniforms[ 'viscosityConstant' ] = { value: 0.98 };

      const error = gpuCompute.init();
      if ( error !== null ) {
        console.error( error );
      }
    }

    function fillTexture( texture ) {
      const waterMaxHeight = 10;
      function noise( x, y ) {
        let multR = waterMaxHeight;
        let mult = 0.025;
        let r = 0;
        for ( let i = 0; i < 15; i ++ ) {
          r += multR * simplex.noise2D( x * mult, y * mult );
          multR *= 0.53;
          mult *= 1.25;
        }
        return r;
      }
      const pixels = texture.image.data;
      let p = 0;
      for ( let j = 0; j < WIDTH; j ++ ) {
        for (let i = 0; i < WIDTH; i++) {
          const x = i / WIDTH;
          const y = j / WIDTH;
          pixels[p] = noise(x, y);
          pixels[p + 1] = pixels[p];
          pixels[p + 2] = 0;
          pixels[p + 3] = 1;
          p += 4;
        }
      }
    }

    function initGUI() {
      const gui = new GUI();
      gui.add( effectController, 'mouseSize', 1.0, 100.0, 1.0 ).onChange( ( v ) => {
        heightmapVariable.material.uniforms[ 'mouseSize' ].value = v / BOUNDS;
      } );
      gui.add( effectController, 'viscosity', 0.9, 0.999, 0.001 ).onChange( ( v ) => {
        heightmapVariable.material.uniforms[ 'viscosityConstant' ].value = v;
      } );
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onPointerMove( event ) {
      mouseCoords.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouseCoords.y = -(event.clientY / window.innerHeight) * 2 + 1;
      mouseMoved = true;
    }

    function animate() {
      requestAnimationFrame( animate );

      if (mouseMoved) {
        raycaster.setFromCamera(mouseCoords, camera);
        const intersects = raycaster.intersectObject(meshRay);
        if (intersects.length > 0) {
          const point = intersects[0].point;
          const u = (point.x + BOUNDS_HALF) / BOUNDS;
          const v = 1.0 - (point.z + BOUNDS_HALF) / BOUNDS;
          heightmapVariable.material.uniforms['mousePos'].value.set(u, v);
        } else {
          heightmapVariable.material.uniforms['mousePos'].value.set(-1, -1);
        }
        mouseMoved = false;
      } else {
        heightmapVariable.material.uniforms['mousePos'].value.set(-1, -1);
      }

      gpuCompute.compute();
      waterUniforms['heightmap'].value = gpuCompute.getCurrentRenderTarget(heightmapVariable).texture;

      renderer.render( scene, camera );
    }
  </script>
</body>
</html>
