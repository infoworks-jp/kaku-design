<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>中央経理センター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;overscroll-behavior:none}
    body{position:fixed;inset:0;touch-action:none}
    #stage{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
    .overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;pointer-events:none;color:#fff;text-align:center;padding:24px;text-shadow:0 3px 24px rgba(0,0,0,.82)}
    .overlay-inner{max-width:980px;transform:translateY(-3vh)}
    .yuragi-char{display:inline-block;animation:char-wave 3s ease-in-out infinite;will-change:transform}
    @keyframes char-wave{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-3px) rotate(1deg)}}
    h1{margin:0 0 24px;font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(38px,6.4vw,88px);font-weight:300;letter-spacing:.2em;line-height:1.25}
    p{margin:0;font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(14px,1.65vw,21px);font-weight:300;line-height:2;letter-spacing:.16em}
    #ui-toggle{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:30;border:1px solid rgba(255,255,255,.58);border-radius:999px;padding:11px 17px;background:rgba(6,13,20,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font:500 12px/1 system-ui,-apple-system,sans-serif;letter-spacing:.08em;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.28);touch-action:manipulation}
    #ui-toggle:focus-visible{outline:2px solid #fff;outline-offset:3px}
    #ui-toggle:disabled{opacity:.5;cursor:wait}
    #status{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:58px;z-index:20;color:#fff;font:12px/1.5 system-ui,sans-serif;text-shadow:0 1px 4px #000}
    #build{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:max(6px,env(safe-area-inset-bottom));z-index:20;color:rgba(255,255,255,.42);font:10px/1 system-ui,sans-serif;pointer-events:none}
    @media(max-width:640px){.overlay{padding:18px}.overlay-inner{transform:translateY(-5vh)}h1{font-size:clamp(34px,11vw,58px);letter-spacing:.1em;margin-bottom:18px}p{font-size:clamp(13px,4vw,17px);letter-spacing:.08em;line-height:1.8}}
    @media(prefers-reduced-motion:reduce){.yuragi-char{animation:none}}
  </style>
</head>
<body>
  <iframe id="stage" title="Three.js GPGPU Water" allow="fullscreen"></iframe>

  <div class="overlay">
    <div class="overlay-inner">
      <h1 id="title">中央経理センター</h1>
      <p id="lead">信頼と実績で、企業の経理と経営を支える。</p>
    </div>
  </div>

  <button id="ui-toggle" type="button" aria-pressed="false" disabled>調整パネルを表示</button>
  <div id="status" role="status" aria-live="polite">公式Three.jsを読み込み中…</div>
  <div id="build">build 20260729-04</div>

  <script>
    const SHA='8e8fb783d8e85bce99545674eb016fa4e8cb7abc';
    const EX=`https://cdn.jsdelivr.net/gh/mrdoob/three.js@${SHA}/examples/`;
    const SOURCE=`${EX}webgl_gpgpu_water.html`;
    const stage=document.getElementById('stage');
    const status=document.getElementById('status');
    const toggle=document.getElementById('ui-toggle');
    const isMobile=matchMedia('(max-width: 820px), (pointer: coarse)').matches;
    let controlsVisible=false;
    let loadFinished=false;
    let uiObserver=null;

    function wrapChars(el){
      el.innerHTML=[...el.textContent].map((c,i)=>
        c===' ' ? c : `<span class="yuragi-char" style="animation-delay:${(i%9)*.12}s">${c}</span>`
      ).join('');
    }

    function isInternalUi(node){
      if(!node || node.nodeType!==1) return false;
      if(node.matches && node.matches('#info,.lil-gui')) return true;
      const style=node.getAttribute ? (node.getAttribute('style')||'') : '';
      return style.includes('z-index: 10000')||style.includes('z-index:10000');
    }

    function findInternalUi(doc){
      return [...doc.querySelectorAll('#info,.lil-gui,div')].filter(isInternalUi);
    }

    function applyControlsState(){
      const doc=stage.contentDocument;
      if(!doc) return;
      findInternalUi(doc).forEach(node=>{node.style.setProperty('display',controlsVisible?'':'none','important');});
    }

    function setControlsVisible(visible){
      controlsVisible=visible;
      applyControlsState();
      toggle.textContent=visible?'調整パネルを隠す':'調整パネルを表示';
      toggle.setAttribute('aria-pressed',String(visible));
    }

    function observeInternalUi(doc){
      if(uiObserver) uiObserver.disconnect();
      uiObserver=new MutationObserver(()=>applyControlsState());
      uiObserver.observe(doc.documentElement,{childList:true,subtree:true});
    }

    function optimizeOfficialHtml(html){
      if(!isMobile) return html.replace('renderer.setPixelRatio( window.devicePixelRatio );','renderer.setPixelRatio( Math.min( window.devicePixelRatio, 1.75 ) );');
      return html
        .replace('const WIDTH = 128;','const WIDTH = 64;')
        .replace('const NUM_DUCK = 12;','const NUM_DUCK = 4;')
        .replace('new THREE.WebGLRenderer( { antialias: true } )','new THREE.WebGLRenderer( { antialias: false, powerPreference: \'high-performance\' } )')
        .replace('renderer.setPixelRatio( window.devicePixelRatio );','renderer.setPixelRatio( Math.min( window.devicePixelRatio, 1.15 ) );')
        .replace('shadow: false,','shadow: false,')
        .replace("stats = new Stats();\n\t\t\t\tcontainer.appendChild( stats.dom );","stats = new Stats();\n\t\t\t\tstats.dom.style.display = 'none';\n\t\t\t\tcontainer.appendChild( stats.dom );");
    }

    wrapChars(document.getElementById('title'));
    wrapChars(document.getElementById('lead'));
    toggle.addEventListener('click',()=>setControlsVisible(!controlsVisible));

    const timeoutId=setTimeout(()=>{
      if(!loadFinished) status.textContent='読み込みに時間がかかっています。通信状態を確認してください。';
    },15000);

    fetch(`${SOURCE}?v=202607292230`,{cache:'no-store'})
      .then(response=>{
        if(!response.ok) throw new Error(`公式HTML HTTP ${response.status}`);
        return response.text();
      })
      .then(html=>{
        const base=`<base href="${EX}">`;
        html=optimizeOfficialHtml(html);
        html=html.replace(/<head([^>]*)>/i,`<head$1>${base}`);
        stage.addEventListener('load',()=>{
          loadFinished=true;
          clearTimeout(timeoutId);
          const doc=stage.contentDocument;
          if(!doc){status.textContent='内部画面へアクセスできませんでした。';return;}
          observeInternalUi(doc);
          setControlsVisible(false);
          toggle.disabled=false;

          let checks=0;
          const canvasCheck=setInterval(()=>{
            checks++;
            const canvas=doc.querySelector('canvas');
            if(canvas){
              canvas.style.touchAction='none';
              status.textContent='';
              applyControlsState();
              clearInterval(canvasCheck);
            }else if(checks>=30){
              status.textContent='WebGL画面を生成できませんでした。';
              clearInterval(canvasCheck);
            }
          },500);
        },{once:true});
        stage.srcdoc=html;
      })
      .catch(error=>{
        loadFinished=true;
        clearTimeout(timeoutId);
        status.textContent=`読み込みエラー: ${error.message}`;
        console.error(error);
      });
  </script>
</body>
</html>
