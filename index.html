<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>中央経理センター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    #stage{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
    .overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;pointer-events:none;color:#fff;text-align:center;padding:24px;text-shadow:0 3px 24px rgba(0,0,0,.82)}
    .overlay-inner{max-width:980px;transform:translateY(-3vh)}
    .yuragi-char{display:inline-block;animation:char-wave 3s ease-in-out infinite;will-change:transform}
    @keyframes char-wave{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(1deg)}}
    h1{margin:0 0 24px;font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(38px,6.4vw,88px);font-weight:300;letter-spacing:.2em;line-height:1.25}
    p{margin:0;font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(14px,1.65vw,21px);font-weight:300;line-height:2;letter-spacing:.16em}
    #ui-toggle{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:30;border:1px solid rgba(255,255,255,.58);border-radius:999px;padding:11px 17px;background:rgba(6,13,20,.7);color:#fff;font:500 12px/1 system-ui,-apple-system,sans-serif;letter-spacing:.08em;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #ui-toggle:disabled{opacity:.5;cursor:wait}
    #status{position:fixed;left:18px;bottom:60px;z-index:20;color:#fff;font:12px/1.5 system-ui,sans-serif;text-shadow:0 1px 4px #000}
    #build{position:fixed;right:10px;bottom:8px;z-index:20;color:rgba(255,255,255,.45);font:10px/1 system-ui,sans-serif;pointer-events:none}
    @media(max-width:820px){.overlay{padding:18px}.overlay-inner{transform:translateY(-5vh)}h1{font-size:clamp(30px,10vw,54px);letter-spacing:.1em}p{font-size:13px;letter-spacing:.08em}.yuragi-char{animation-duration:4.5s;will-change:auto}}
    @media(prefers-reduced-motion:reduce){.yuragi-char{animation:none}}
  </style>
</head>
<body>
  <iframe id="stage" title="Three.js GPGPU Water" allow="fullscreen"></iframe>
  <div class="overlay"><div class="overlay-inner"><h1 id="title">中央経理センター</h1><p id="lead">信頼と実績で、企業の経理と経営を支える。</p></div></div>
  <button id="ui-toggle" type="button" aria-pressed="false" disabled>調整パネルを表示</button>
  <div id="status" role="status" aria-live="polite">公式Three.jsを読み込み中…</div>
  <div id="build">build 20260729-08</div>
<script>
const SHA='8e8fb783d8e85bce99545674eb016fa4e8cb7abc';
const EX=`https://cdn.jsdelivr.net/gh/mrdoob/three.js@${SHA}/examples/`;
const SOURCE=`${EX}webgl_gpgpu_water.html`;
const stage=document.getElementById('stage');
const status=document.getElementById('status');
const toggle=document.getElementById('ui-toggle');
const isMobile=matchMedia('(max-width:820px)').matches;
let controlsVisible=false;
let observer=null;

function wrapChars(el){el.innerHTML=[...el.textContent].map((c,i)=>c===' '?c:`<span class="yuragi-char" style="animation-delay:${(i%9)*.12}s">${c}</span>`).join('')}
wrapChars(document.getElementById('title'));
wrapChars(document.getElementById('lead'));

function applyControlsState(){
  const doc=stage.contentDocument;
  if(!doc) return false;
  const gui=doc.getElementById('three-gui');
  const info=doc.getElementById('info');
  const stats=doc.getElementById('three-stats');
  if(info) info.style.setProperty('display','none','important');
  if(stats) stats.style.setProperty('display','none','important');
  if(gui) gui.style.setProperty('display',controlsVisible?'':'none','important');
  return Boolean(gui&&stats);
}

function setControlsVisible(visible){
  controlsVisible=visible;
  applyControlsState();
  toggle.textContent=visible?'調整パネルを隠す':'調整パネルを表示';
  toggle.setAttribute('aria-pressed',String(visible));
}
toggle.addEventListener('click',()=>setControlsVisible(!controlsVisible));

function replaceRequired(html,search,replacement,label){
  if(!html.includes(search)) throw new Error(`${label} の組み込み位置が見つかりません`);
  return html.replace(search,replacement);
}

function prepareOfficialHtml(html){
  const iframeCss='<style>#info,#three-stats{display:none!important}html.ui-hidden #three-gui{display:none!important}</style>';
  html=html.replace(/<head([^>]*)>/i,`<head$1><base href="${EX}">${iframeCss}<script>document.documentElement.classList.add('ui-hidden')<\/script>`);
  html=replaceRequired(html,'stats = new Stats();',"stats = new Stats(); stats.dom.id = 'three-stats'; stats.dom.style.setProperty('display','none','important');",'Stats');
  html=replaceRequired(html,'const gui = new GUI();',"const gui = new GUI(); gui.domElement.id = 'three-gui'; gui.domElement.style.setProperty('display','none','important');",'GUI');
  html=replaceRequired(html,'renderer.setPixelRatio( window.devicePixelRatio );',`renderer.setPixelRatio( Math.min( window.devicePixelRatio, ${isMobile?'1':'1.75'} ) );`,'pixelRatio');
  if(isMobile){
    html=replaceRequired(html,'const WIDTH = 128;','const WIDTH = 64;','水面解像度');
    html=replaceRequired(html,'const NUM_DUCK = 12;','const NUM_DUCK = 3;','アヒル数');
    html=replaceRequired(html,'new THREE.WebGLRenderer( { antialias: true } )',"new THREE.WebGLRenderer( { antialias: false, powerPreference: 'high-performance' } )",'Renderer');
  }
  return html;
}

const timeout=setTimeout(()=>status.textContent='読み込みに時間がかかっています。通信状態を確認してください。',15000);
fetch(`${SOURCE}?v=202607292359`,{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error(`公式HTML HTTP ${r.status}`);return r.text()})
  .then(html=>{
    html=prepareOfficialHtml(html);
    stage.addEventListener('load',()=>{
      clearTimeout(timeout);
      const doc=stage.contentDocument;
      if(!doc){status.textContent='内部画面へアクセスできませんでした。';return}
      setControlsVisible(false);
      let checks=0;
      observer=new MutationObserver(()=>{
        const ready=applyControlsState();
        if(ready&&observer){observer.disconnect();observer=null;}
      });
      observer.observe(doc.documentElement,{childList:true,subtree:true});
      const check=setInterval(()=>{
        checks++;
        const canvas=doc.querySelector('canvas');
        const ready=applyControlsState();
        if(canvas&&ready){
          canvas.style.touchAction='none';
          status.textContent='';
          toggle.disabled=false;
          if(observer){observer.disconnect();observer=null;}
          clearInterval(check);
        }else if(checks>=40){
          status.textContent='WebGLまたは調整パネルを生成できませんでした。';
          if(observer){observer.disconnect();observer=null;}
          clearInterval(check);
        }
      },500);
    },{once:true});
    stage.srcdoc=html;
  })
  .catch(err=>{clearTimeout(timeout);status.textContent=`読み込みエラー: ${err.message}`;console.error(err)});
</script>
</body>
</html>
