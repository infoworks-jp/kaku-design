<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中央経理センター</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .content-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      color: #ffffff;
      pointer-events: none;
      width: 90%;
      max-width: 800px;
    }
    h1.main-title {
      font-size: 3.2rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 0 10px rgba(56, 189, 248, 0.6);
      opacity: 0;
      animation: waterEmerge 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }
    p.sub-text {
      font-size: 1.25rem;
      letter-spacing: 0.18em;
      line-height: 1.8;
      color: rgba(230, 245, 255, 0.95);
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 0 8px rgba(56, 189, 248, 0.4);
      opacity: 0;
      animation: waterEmerge 2.5s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
    }
    @keyframes waterEmerge {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
        filter: blur(12px);
      }
      50% {
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }
  </style>
  <!-- Standard Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="container"></div>

  <div class="content-overlay">
    <h1 class="main-title">中央経理センター</h1>
    <p class="sub-text">信頼と実績でビジネスの未来をサポートします</p>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('container');

      // Scene, Camera, Renderer Setup
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, -25, 20);
      camera.lookAt(0, 5, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0x0284c7, 1.2);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x38bdf8, 2.5);
      dirLight.position.set(20, 30, 20);
      scene.add(dirLight);

      const pointLight = new THREE.PointLight(0x0284c7, 3, 50);
      pointLight.position.set(0, 0, 10);
      scene.add(pointLight);

      // Water Mesh Geometry (High Density Grid for Smooth Wave Calculation)
      const size = 60;
      const grid = 128;
      const geometry = new THREE.PlaneGeometry(size, size, grid, grid);

      const material = new THREE.MeshPhongMaterial({
        color: 0x030712,
        emissive: 0x0284c7,
        specular: 0x38bdf8,
        shininess: 120,
        wireframe: false,
        flatShading: true,
        transparent: true,
        opacity: 0.92
      });

      const waterMesh = new THREE.Mesh(geometry, material);
      scene.add(waterMesh);

      // Interactive 波紋 Simulation Logic
      const pos = geometry.attributes.position;
      const count = pos.count;
      let ripples = [];

      function addRipple(x, y) {
        ripples.push({ x: x, y: y, time: 0, amplitude: 2.0 });
        if (ripples.length > 10) ripples.shift();
      }

      window.addEventListener('pointermove', (e) => {
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = -(e.clientY / window.innerHeight) * 2 + 1;
        addRipple(x * (size / 2), y * (size / 2));
      });

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();

        for (let i = 0; i < count; i++) {
          const vx = pos.getX(i);
          const vy = pos.getY(i);
          
          // Base Ocean Wave
          let z = Math.sin(vx * 0.15 + time * 1.8) * 0.4 + Math.cos(vy * 0.15 + time * 1.8) * 0.4;

          // Interactive Mouse Ripples Propagation
          ripples.forEach(r => {
            const dx = vx - r.x;
            const dy = vy - r.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const waveRadius = r.time * 12;

            if (dist < waveRadius && dist > (waveRadius - 6)) {
              const wave = Math.sin((dist - waveRadius) * 1.5);
              const fade = Math.max(0, 1 - r.time / 2.5);
              z += wave * r.amplitude * fade;
            }
          });

          pos.setZ(i, z);
        }

        ripples.forEach(r => r.time += 0.03);
        ripples = ripples.filter(r => r.time < 2.5);

        pos.needsUpdate = true;
        geometry.computeVertexNormals();

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    });
  </script>
</body>
</html>
