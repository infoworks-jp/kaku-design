<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中央経理センター</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .content-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      color: #ffffff;
      pointer-events: none;
      width: 90%;
      max-width: 800px;
    }
    h1.main-title {
      font-size: 3.2rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 0 10px rgba(56, 189, 248, 0.6);
      opacity: 0;
      animation: waterEmerge 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }
    p.sub-text {
      font-size: 1.25rem;
      letter-spacing: 0.18em;
      line-height: 1.8;
      color: rgba(230, 245, 255, 0.95);
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 0 8px rgba(56, 189, 248, 0.4);
      opacity: 0;
      animation: waterEmerge 2.5s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
    }
    @keyframes waterEmerge {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
        filter: blur(12px);
      }
      50% {
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }
  </style>
  <!-- Import maps polyfill & Three.js ES Modules -->
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="container"></div>

  <div class="content-overlay">
    <h1 class="main-title">中央経理センター</h1>
    <p class="sub-text">信頼と実績でビジネスの未来をサポートします</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
    import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';
    import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';

    // GPGPU Water Simulation Parameters
    const WIDTH = 128;
    const BOUNDS = 512;
    const BOUNDS_HALF = BOUNDS / 2;

    let container;
    let camera, scene, renderer;
    let mouseMoved = false;
    const mouseCoords = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();

    let gpuCompute;
    let heightmapVariable;
    let waterUniforms;
    let smoothShader;
    let readWaterLevelShader;
    let readWaterLevelRenderTarget;
    let readWaterLevelImage;

    const simplex = new SimplexNoise();

    init();
    animate();

    function init() {
      container = document.getElementById('container');

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 3000);
      camera.position.set(0, 200, 350);
      camera.lookAt(0, 0, 0);

      scene = new THREE.Scene();

      const sun = new THREE.DirectionalLight(0xFFFFFF, 3.0);
      sun.position.set(300, 400, 300);
      scene.add(sun);

      const ambient = new THREE.AmbientLight(0x0a192f, 1.0);
      scene.add(ambient);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      initWater();

      container.style.touchAction = 'none';
      container.addEventListener('pointermove', onPointerMove);

      window.addEventListener('resize', onWindowResize);
    }

    function initWater() {
      const materialColor = 0x004466;
      const geometry = new THREE.PlaneGeometry(BOUNDS, BOUNDS, WIDTH - 1, WIDTH - 1);

      // Water Material
      const waterMaterial = new THREE.ShaderMaterial({
        uniforms: THREE.UniformsUtils.merge([
          THREE.UniformsLib['fog'],
          THREE.UniformsLib['lights'],
          {
            'heightmap': { value: null },
            'diffuse': { value: new THREE.Color(materialColor) },
            'depth': { value: 20.0 }
          }
        ]),
        vertexShader: `
          uniform sampler2D heightmap;
          varying vec3 vNormal;
          varying vec3 vViewPosition;

          void main() {
            vec4 heightmapValue = texture2D(heightmap, uv);
            vec3 transformed = vec3(position.x, position.y, heightmapValue.x);

            // Compute Normal
            vec2 du = vec2(1.0 / ${WIDTH.toFixed(1)}, 0.0);
            vec2 dv = vec2(0.0, 1.0 / ${WIDTH.toFixed(1)});
            float c = heightmapValue.x;
            float r = texture2D(heightmap, uv + du).x;
            float t = texture2D(heightmap, uv + dv).x;
            vNormal = normalize(vec3(c - r, c - t, 1.0));

            vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.0);
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 diffuse;
          varying vec3 vNormal;
          varying vec3 vViewPosition;

          void main() {
            vec3 normal = normalize(vNormal);
            vec3 lightDir = normalize(vec3(0.5, 1.0, 0.7));
            float light = max(dot(normal, lightDir), 0.2);
            vec3 color = diffuse * light + vec3(0.1, 0.3, 0.5) * pow(light, 3.0);
            gl_FragColor = vec4(color, 0.9);
          `,
        transparent: true,
        lights: true
      });

      // Override fragmentShader to strictly render clean GPGPU water surface
      waterMaterial.fragmentShader = `
        uniform vec3 diffuse;
        varying vec3 vNormal;
        varying vec3 vViewPosition;

        void main() {
          vec3 normal = normalize(vNormal);
          vec3 lightDir = normalize(vec3(0.3, 0.8, 0.5));
          float spec = pow(max(dot(reflect(-lightDir, normal), normalize(vViewPosition)), 0.0), 32.0);
          float diff = max(dot(normal, lightDir), 0.3);
          vec3 finalColor = diffuse * diff + vec3(0.4, 0.8, 1.0) * spec;
          gl_FragColor = vec4(finalColor, 0.92);
        }
      `;

      const waterMesh = new THREE.Mesh(geometry, waterMaterial);
      waterMesh.rotation.x = -Math.PI / 2;
      waterMesh.matrixAutoUpdate = false;
      waterMesh.updateMatrix();
      scene.add(waterMesh);

      // GPGPU Computation Setup
      gpuCompute = new GPUComputationRenderer(WIDTH, WIDTH, renderer);

      const heightmap0 = gpuCompute.createTexture();
      fillTexture(heightmap0);

      heightmapVariable = gpuCompute.addVariable('heightmap', getHeightmapFragmentShader(), heightmap0);
      gpuCompute.setVariableDependencies(heightmapVariable, [heightmapVariable]);

      heightmapVariable.material.uniforms['mousePos'] = { value: new THREE.Vector2(10000, 10000) };
      heightmapVariable.material.uniforms['mouseSize'] = { value: 20.0 };
      heightmapVariable.material.uniforms['viscosityConstant'] = { value: 0.98 };

      gpuCompute.init();

      waterUniforms = waterMaterial.uniforms;
    }

    function fillTexture(texture) {
      const waterMaxHeight = 10;
      const pixels = texture.image.data;
      let p = 0;
      for (let j = 0; j < WIDTH; j++) {
        for (let i = 0; i < WIDTH; i++) {
          const x = i / WIDTH;
          const y = j / WIDTH;
          pixels[p] = simplex.noise2D(x * 5, y * 5) * waterMaxHeight;
          pixels[p + 1] = 0;
          pixels[p + 2] = 0;
          pixels[p + 3] = 1;
          p += 4;
        }
      }
    }

    function getHeightmapFragmentShader() {
      return `
        uniform vec2 mousePos;
        uniform float mouseSize;
        uniform float viscosityConstant;

        void main() {
          vec2 cellSize = vec2(1.0 / ${WIDTH.toFixed(1)});
          vec2 uv = gl_FragCoord.xy * cellSize;

          vec4 heightmapValue = texture2D(heightmap, uv);
          vec4 north = texture2D(heightmap, uv + vec2(0.0, cellSize.y));
          vec4 south = texture2D(heightmap, uv + vec2(0.0, -cellSize.y));
          vec4 east = texture2D(heightmap, uv + vec2(cellSize.x, 0.0));
          vec4 west = texture2D(heightmap, uv + vec2(-cellSize.x, 0.0));

          float newHeight = (north.x + south.x + east.x + west.x) * 0.5 - heightmapValue.y;
          newHeight *= viscosityConstant;

          // Mouse Ripple Impact
          float phase = distance(uv, mousePos);
          if (phase < mouseSize * cellSize.x) {
            newHeight += (1.0 - phase / (mouseSize * cellSize.x)) * 3.0;
          }

          gl_FragColor = vec4(newHeight, heightmapValue.x, 0.0, 1.0);
        }
      `;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onPointerMove(event) {
      if (event.isPrimary === false) return;
      mouseCoords.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouseCoords.y = -(event.clientY / window.innerHeight) * 2 + 1;
      mouseMoved = true;
    }

    function raycast() {
      raycaster.setFromCamera(mouseCoords, camera);
      const uniforms = heightmapVariable.material.uniforms;
      if (mouseMoved) {
        const ray = raycaster.ray;
        const targetZ = 0;
        const distance = (targetZ - ray.origin.y) / ray.direction.y;
        const hitPoint = ray.origin.clone().add(ray.direction.clone().multiplyScalar(distance));
        uniforms['mousePos'].value.set(
          (hitPoint.x + BOUNDS_HALF) / BOUNDS,
          (1.0 - (hitPoint.z + BOUNDS_HALF) / BOUNDS)
        );
        mouseMoved = false;
      } else {
        uniforms['mousePos'].value.set(10000, 10000);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      render();
    }

    function render() {
      raycast();
      gpuCompute.compute();
      waterUniforms['heightmap'].value = gpuCompute.getCurrentRenderTarget(heightmapVariable).texture;
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
