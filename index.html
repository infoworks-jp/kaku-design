<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中央経理センター</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    #stage{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
    .overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;pointer-events:none;color:#fff;text-align:center;padding:24px;text-shadow:0 3px 22px rgba(0,0,0,.82)}
    .overlay-inner{max-width:980px;transform:translateY(-2vh)}
    .yuragi-char{display:inline-block;animation:char-wave 3s ease-in-out infinite;will-change:transform}
    @keyframes char-wave{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-3px) rotate(1deg)}}
    h1{margin:0 0 22px;font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif JP","Times New Roman",serif;font-size:clamp(36px,6vw,82px);font-weight:500;letter-spacing:.16em;line-height:1.28}
    p{margin:0;font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif JP",serif;font-size:clamp(15px,1.8vw,23px);font-weight:400;line-height:2;letter-spacing:.12em}
    #ui-toggle{position:fixed;right:18px;bottom:18px;z-index:30;border:1px solid rgba(255,255,255,.42);border-radius:999px;padding:10px 16px;background:rgba(10,18,24,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:500 13px/1 system-ui,-apple-system,"Helvetica Neue",sans-serif;letter-spacing:.08em;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.24);transition:.2s ease}
    #ui-toggle:hover{background:rgba(10,18,24,.68);border-color:rgba(255,255,255,.7)}
    #ui-toggle:focus-visible{outline:2px solid #fff;outline-offset:3px}
    #status{position:fixed;left:16px;bottom:14px;z-index:20;color:#fff;font:13px/1.5 system-ui,sans-serif;text-shadow:0 1px 4px #000}
    @media(max-width:640px){h1{letter-spacing:.1em}.overlay{padding:18px}#ui-toggle{right:12px;bottom:12px}}
  </style>
</head>
<body>
  <iframe id="stage" title="Three.js GPGPU Water" allow="fullscreen"></iframe>

  <div class="overlay">
    <div class="overlay-inner">
      <h1 id="title">中央経理センター</h1>
      <p id="lead">信頼と実績で、企業の経理と経営を支える。</p>
    </div>
  </div>

  <button id="ui-toggle" type="button" aria-pressed="false">パネルを隠す</button>
  <div id="status">公式Three.jsを読み込み中…</div>

  <script>
    const SHA='8e8fb783d8e85bce99545674eb016fa4e8cb7abc';
    const EX=`https://cdn.jsdelivr.net/gh/mrdoob/three.js@${SHA}/examples/`;
    const SOURCE=`${EX}webgl_gpgpu_water.html`;
    const stage=document.getElementById('stage');
    const status=document.getElementById('status');
    const toggle=document.getElementById('ui-toggle');
    let controlsVisible=true;

    function wrapChars(el){
      el.innerHTML=[...el.textContent].map((c,i)=>
        c===' ' ? c : `<span class="yuragi-char" style="animation-delay:${(i%9)*.12}s">${c}</span>`
      ).join('');
    }

    function setControlsVisible(visible){
      controlsVisible=visible;
      const doc=stage.contentDocument;
      if(!doc) return;
      doc.documentElement.classList.toggle('presentation-mode',!visible);
      toggle.textContent=visible?'パネルを隠す':'パネルを表示';
      toggle.setAttribute('aria-pressed',String(!visible));
    }

    wrapChars(document.getElementById('title'));
    wrapChars(document.getElementById('lead'));

    toggle.addEventListener('click',()=>setControlsVisible(!controlsVisible));

    fetch(SOURCE,{cache:'no-store'})
      .then(response=>{
        if(!response.ok) throw new Error(`公式HTML HTTP ${response.status}`);
        return response.text();
      })
      .then(html=>{
        const base=`<base href="${EX}">`;
        const injectedStyle=`<style>
          html.presentation-mode #info,
          html.presentation-mode .lil-gui,
          html.presentation-mode .stats{display:none!important}
        </style>`;
        html=html.replace(/<head([^>]*)>/i,`<head$1>${base}${injectedStyle}`);
        stage.addEventListener('load',()=>{
          status.textContent='';
          setControlsVisible(true);
        },{once:true});
        stage.srcdoc=html;
      })
      .catch(error=>{
        status.textContent=`読み込みエラー: ${error.message}`;
        console.error(error);
      });
  </script>
</body>
</html>
