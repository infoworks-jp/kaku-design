<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中央経理センター</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .content-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      color: #ffffff;
      pointer-events: none;
      width: 90%;
      max-width: 800px;
    }
    h1.main-title {
      font-size: 3.2rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 0 10px rgba(56, 189, 248, 0.6);
      opacity: 0;
      animation: waterEmerge 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }
    p.sub-text {
      font-size: 1.25rem;
      letter-spacing: 0.18em;
      line-height: 1.8;
      color: rgba(230, 245, 255, 0.95);
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 0 8px rgba(56, 189, 248, 0.4);
      opacity: 0;
      animation: waterEmerge 2.5s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
    }
    @keyframes waterEmerge {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
        filter: blur(12px);
      }
      50% {
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="container"></div>

  <div class="content-overlay">
    <h1 class="main-title">中央経理センター</h1>
    <p class="sub-text">信頼と実績でビジネスの未来をサポートします</p>
  </div>

  <script>
    window.addEventListener('load', () => {
      const container = document.getElementById('container');
      const WIDTH = 128;
      const BOUNDS = 512;

      // 1. Scene / Camera / Renderer
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 3000);
      camera.position.set(0, 200, 320);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x020617, 1);
      container.appendChild(renderer.domElement);

      // 2. GPGPU Simulation Render Targets (Ping-Pong Buffer)
      const renderTargetParams = {
        wrapS: THREE.ClampToEdgeWrapping,
        wrapT: THREE.ClampToEdgeWrapping,
        minFilter: THREE.NearestFilter,
        magFilter: THREE.NearestFilter,
        format: THREE.RGBAFormat,
        type: THREE.HalfFloatType
      };

      let gpuRenderTarget1 = new THREE.WebGLRenderTarget(WIDTH, WIDTH, renderTargetParams);
      let gpuRenderTarget2 = new THREE.WebGLRenderTarget(WIDTH, WIDTH, renderTargetParams);

      // GPGPU Heightmap Shader
      const heightmapShaderMaterial = new THREE.ShaderMaterial({
        uniforms: {
          'heightmap': { value: null },
          'mousePos': { value: new THREE.Vector2(-1.0, -1.0) },
          'mouseSize': { value: 0.04 },
          'viscosity': { value: 0.97 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D heightmap;
          uniform vec2 mousePos;
          uniform float mouseSize;
          uniform float viscosity;
          varying vec2 vUv;

          void main() {
            vec2 cellSize = vec2(1.0 / 128.0);

            // 境界チェック（端のノイズ・破綻防止）
            if (vUv.x < cellSize.x || vUv.x > 1.0 - cellSize.x ||
                vUv.y < cellSize.y || vUv.y > 1.0 - cellSize.y) {
              gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
              return;
            }

            vec4 val = texture2D(heightmap, vUv);

            float north = texture2D(heightmap, vUv + vec2(0.0, cellSize.y)).r;
            float south = texture2D(heightmap, vUv + vec2(0.0, -cellSize.y)).r;
            float east = texture2D(heightmap, vUv + vec2(cellSize.x, 0.0)).r;
            float west = texture2D(heightmap, vUv + vec2(-cellSize.x, 0.0)).r;

            // 2D 波動方程式の計算
            float newHeight = (north + south + east + west) * 0.5 - val.g;
            newHeight *= viscosity;

            // マウス位置の有効判定（-1.0で非検出）
            if (mousePos.x >= 0.0 && mousePos.y >= 0.0) {
              float dist = distance(vUv, mousePos);
              if (dist < mouseSize) {
                newHeight += (1.0 - dist / mouseSize) * 6.0;
              }
            }

            gl_FragColor = vec4(newHeight, val.r, 0.0, 1.0);
          }
        `
      });

      const gpuScene = new THREE.Scene();
      const gpuCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const gpuQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), heightmapShaderMaterial);
      gpuScene.add(gpuQuad);

      // 初期化用シェーダー
      const clearShader = new THREE.ShaderMaterial({
        vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
        fragmentShader: `void main() { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); }`
      });
      const clearQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), clearShader);
      const clearScene = new THREE.Scene();
      clearScene.add(clearQuad);

      renderer.setRenderTarget(gpuRenderTarget1);
      renderer.render(clearScene, gpuCamera);
      renderer.setRenderTarget(gpuRenderTarget2);
      renderer.render(clearScene, gpuCamera);
      renderer.setRenderTarget(null);

      // 3. Visible Water Mesh & Material
      const geometry = new THREE.PlaneGeometry(BOUNDS, BOUNDS, WIDTH, WIDTH);
      
      const waterMaterial = new THREE.ShaderMaterial({
        uniforms: {
          'heightmap': { value: null },
          'waterColor': { value: new THREE.Color(0x0284c7) },
          'sparkleColor': { value: new THREE.Color(0x38bdf8) }
        },
        vertexShader: `
          uniform sampler2D heightmap;
          varying vec3 vWorldNormal;
          varying vec3 vViewDir;

          void main() {
            vec4 hVal = texture2D(heightmap, uv);
            vec3 pos = vec3(position.x, position.y, hVal.r * 2.0);

            vec2 du = vec2(1.0 / 128.0, 0.0);
            vec2 dv = vec2(0.0, 1.0 / 128.0);
            float c = hVal.r;
            float r = texture2D(heightmap, uv + du).r;
            float t = texture2D(heightmap, uv + dv).r;
            
            vec3 localNormal = normalize(vec3((c - r) * 10.0, (c - t) * 10.0, 1.0));
            vWorldNormal = normalize(mat3(modelMatrix) * localNormal);

            vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
            vViewDir = normalize(cameraPosition - worldPosition.xyz);

            gl_Position = projectionMatrix * viewMatrix * worldPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 waterColor;
          uniform vec3 sparkleColor;
          varying vec3 vWorldNormal;
          varying vec3 vViewDir;

          void main() {
            vec3 normal = normalize(vWorldNormal);
            vec3 lightDir = normalize(vec3(0.4, 0.8, 0.5));

            float diff = max(dot(normal, lightDir), 0.2);
            vec3 reflectDir = reflect(-lightDir, normal);
            float spec = pow(max(dot(vViewDir, reflectDir), 0.0), 32.0);

            float fresnel = pow(1.0 - max(dot(vViewDir, normal), 0.0), 3.0);

            vec3 base = mix(waterColor * diff, vec3(0.02, 0.15, 0.35), fresnel);
            vec3 finalColor = base + sparkleColor * spec * 1.8;

            gl_FragColor = vec4(finalColor, 0.92);
          }
        `,
        transparent: true
      });

      const waterMesh = new THREE.Mesh(geometry, waterMaterial);
      waterMesh.rotation.x = -Math.PI / 2;
      scene.add(waterMesh);

      // 4. Raycaster Interaction
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener('pointermove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(waterMesh);
        if (intersects.length > 0 && intersects[0].uv) {
          heightmapShaderMaterial.uniforms['mousePos'].value.copy(intersects[0].uv);
        } else {
          heightmapShaderMaterial.uniforms['mousePos'].value.set(-1.0, -1.0);
        }
      });

      // 5. Main Animation Loop
      function animate() {
        requestAnimationFrame(animate);

        // GPGPU Heightmap Compute
        heightmapShaderMaterial.uniforms['heightmap'].value = gpuRenderTarget1.texture;
        renderer.setRenderTarget(gpuRenderTarget2);
        renderer.render(gpuScene, gpuCamera);

        // Ping-Pong Swap
        const temp = gpuRenderTarget1;
        gpuRenderTarget1 = gpuRenderTarget2;
        gpuRenderTarget2 = temp;

        // Main Render
        waterMaterial.uniforms['heightmap'].value = gpuRenderTarget1.texture;
        renderer.setRenderTarget(null);
        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    });
  </script>
</body>
</html>
