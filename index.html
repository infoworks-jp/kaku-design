<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>中央経理センター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    #stage{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
    .overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;pointer-events:none;color:#fff;text-align:center;padding:24px;text-shadow:0 3px 24px rgba(0,0,0,.82)}
    .overlay-inner{max-width:980px;transform:translateY(-3vh)}
    .yuragi-char{display:inline-block;animation:char-wave 3s ease-in-out infinite;will-change:transform}
    @keyframes char-wave{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-3px) rotate(1deg)}}
    h1{margin:0 0 24px;font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(38px,6.4vw,88px);font-weight:300;letter-spacing:.2em;line-height:1.25}
    p{margin:0;font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(14px,1.65vw,21px);font-weight:300;line-height:2;letter-spacing:.16em}
    #ui-toggle{position:fixed;left:18px;bottom:18px;z-index:30;border:1px solid rgba(255,255,255,.58);border-radius:999px;padding:11px 17px;background:rgba(6,13,20,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font:500 12px/1 system-ui,-apple-system,sans-serif;letter-spacing:.1em;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.28)}
    #ui-toggle:hover{background:rgba(6,13,20,.82)}
    #status{position:fixed;left:18px;bottom:60px;z-index:20;color:#fff;font:12px/1.5 system-ui,sans-serif;text-shadow:0 1px 4px #000}
    @media(max-width:640px){h1{letter-spacing:.12em}.overlay{padding:18px}#ui-toggle{left:12px;bottom:12px}}
  </style>
</head>
<body>
  <iframe id="stage" title="Three.js GPGPU Water" allow="fullscreen"></iframe>

  <div class="overlay">
    <div class="overlay-inner">
      <h1 id="title">中央経理センター</h1>
      <p id="lead">信頼と実績で、企業の経理と経営を支える。</p>
    </div>
  </div>

  <button id="ui-toggle" type="button" aria-pressed="true">調整パネルを表示</button>
  <div id="status">公式Three.jsを読み込み中…</div>

  <script>
    const SHA='8e8fb783d8e85bce99545674eb016fa4e8cb7abc';
    const EX=`https://cdn.jsdelivr.net/gh/mrdoob/three.js@${SHA}/examples/`;
    const SOURCE=`${EX}webgl_gpgpu_water.html`;
    const stage=document.getElementById('stage');
    const status=document.getElementById('status');
    const toggle=document.getElementById('ui-toggle');
    let controlsVisible=false;

    function wrapChars(el){
      el.innerHTML=[...el.textContent].map((c,i)=>
        c===' ' ? c : `<span class="yuragi-char" style="animation-delay:${(i%9)*.12}s">${c}</span>`
      ).join('');
    }

    function setControlsVisible(visible){
      controlsVisible=visible;
      const doc=stage.contentDocument;
      if(doc) doc.documentElement.classList.toggle('presentation-mode',!visible);
      toggle.textContent=visible?'調整パネルを隠す':'調整パネルを表示';
      toggle.setAttribute('aria-pressed',String(!visible));
    }

    wrapChars(document.getElementById('title'));
    wrapChars(document.getElementById('lead'));
    toggle.addEventListener('click',()=>setControlsVisible(!controlsVisible));

    fetch(`${SOURCE}?v=202607292147`,{cache:'no-store'})
      .then(response=>{
        if(!response.ok) throw new Error(`公式HTML HTTP ${response.status}`);
        return response.text();
      })
      .then(html=>{
        const base=`<base href="${EX}">`;
        const injectedStyle=`<style>
          html.presentation-mode #info,
          html.presentation-mode .lil-gui,
          html.presentation-mode body > div[style*="position: fixed"][style*="top: 0px"]{display:none!important}
        </style>`;
        html=html.replace(/<head([^>]*)>/i,`<head$1>${base}${injectedStyle}`);
        stage.addEventListener('load',()=>{
          status.textContent='';
          setControlsVisible(false);
        },{once:true});
        stage.srcdoc=html;
      })
      .catch(error=>{
        status.textContent=`読み込みエラー: ${error.message}`;
        console.error(error);
      });
  </script>
</body>
</html>
