<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>GENBA AI | 経営ダッシュボード</title>
<style>
:root{--bg:#0b0d10;--panel:#12161b;--panel2:#0e1217;--line:#252c34;--text:#f4f6f8;--muted:#9fa8b3;--accent:#e85d3f;--ok:#59d18c;--warn:#f3bd52;--danger:#ff7272}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}button,input,select{font:inherit;max-width:100%}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh;width:100%;max-width:100%}.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 16px;background:#090b0e;min-width:0}.brand{font-weight:900;font-size:18px;margin:0 8px 28px}.brand b{color:var(--accent)}.nav{display:grid;gap:6px}.nav button{width:100%;text-align:left;border:0;border-radius:9px;padding:11px 12px;background:transparent;color:var(--muted);cursor:pointer}.nav button.active,.nav button:hover{background:#151a20;color:#fff}.version{position:absolute;left:24px;bottom:20px;color:#626b76;font-size:11px}.main{padding:28px 32px 60px;min-width:0;max-width:100%;overflow:hidden}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px;min-width:0}.top>div{min-width:0}.top h1{margin:0;font-size:30px}.top p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap;min-width:0}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer;max-width:100%}.btn.secondary{background:#171c22;border:1px solid var(--line)}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px;min-width:0}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}.kpi small{display:block;color:var(--muted);font-size:12px}.kpi strong{display:block;font-size:24px;margin-top:6px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:16px;min-width:0}.grid>*{min-width:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:16px;min-width:0;max-width:100%}.card h2{font-size:18px;margin:0 0 14px}.tablewrap{overflow-x:auto;overflow-y:hidden;max-width:100%;width:100%;-webkit-overflow-scrolling:touch}table{width:100%;min-width:720px;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.ok{background:rgba(89,209,140,.12);color:var(--ok)}.warn{background:rgba(243,189,82,.12);color:var(--warn)}.danger{background:rgba(255,114,114,.12);color:var(--danger)}.formgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;min-width:0}.field{min-width:0}.field label{display:block;font-size:11px;color:var(--muted);margin:0 0 5px}.field input,.field select{width:100%;min-width:0;padding:10px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text)}.full{grid-column:1/-1}.alerts{display:grid;gap:8px}.alert{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:12px;min-width:0}.alert b{display:block;font-size:13px}.alert span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.bar{height:7px;background:#0a0d10;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}.empty{padding:20px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.modalbox{width:min(520px,100%);max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.modalbox h3{margin:0 0 14px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}.note{font-size:11px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}@media(max-width:980px){.shell{grid-template-columns:minmax(0,1fr)}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;width:100%}.brand{margin:0 0 10px}.nav{grid-template-columns:repeat(3,minmax(0,1fr));width:100%}.version{display:none}.main{padding:20px 16px 50px;width:100%}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:minmax(0,1fr)}.top{display:block}.actions{margin-top:14px}.card{padding:14px}table{min-width:680px}}@media(max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi strong{font-size:19px}.formgrid{grid-template-columns:minmax(0,1fr)}.full{grid-column:auto}.nav button{font-size:12px;padding:8px}.top h1{font-size:24px}.actions .btn{flex:1 1 auto}.modal{padding:12px}.modalbox{padding:16px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="brand">GENBA <b>AI</b></div><div class="nav"><button class="active">経営</button><button onclick="document.getElementById('projects').scrollIntoView({behavior:'smooth'})">現場</button><button onclick="document.getElementById('entries').scrollIntoView({behavior:'smooth'})">人工</button></div><div class="version">MVP / local prototype</div></aside>
<main class="main">
<div class="top"><div><h1>経営ダッシュボード</h1><p>現場別の「残る金」を毎日見る。</p></div><div class="actions"><button class="btn secondary" id="exportBtn">CSV出力</button><button class="btn secondary" id="resetBtn">デモ初期化</button><button class="btn" id="newProjectBtn">＋ 現場追加</button></div></div>
<section class="kpis"><div class="kpi"><small>契約売上</small><strong id="kSales">-</strong></div><div class="kpi"><small>人工原価</small><strong id="kLabor">-</strong></div><div class="kpi"><small>その他原価</small><strong id="kOther">-</strong></div><div class="kpi"><small>粗利益</small><strong id="kProfit">-</strong></div><div class="kpi"><small>粗利率</small><strong id="kMargin">-</strong></div></section>
<div class="grid"><div>
<section class="card" id="projects"><h2>現場別採算</h2><div class="tablewrap"><table><thead><tr><th>現場</th><th>元請</th><th>売上</th><th>人工</th><th>総原価</th><th>粗利</th><th>粗利率</th><th>請求</th></tr></thead><tbody id="projectRows"></tbody></table></div></section>
<section class="card" id="entries"><h2>人工・経費を追加</h2><div class="formgrid"><div class="field"><label>現場</label><select id="entryProject"></select></div><div class="field"><label>日付</label><input id="entryDate" type="date"></div><div class="field"><label>人工数</label><input id="entryDays" type="number" step="0.5" value="1"></div><div class="field"><label>1人工実原価</label><input id="entryRate" type="number" value="18500"></div><div class="field"><label>材料・外注・経費</label><input id="entryOther" type="number" value="0"></div><div class="field"><label>メモ</label><input id="entryMemo" placeholder="例：夜間作業"></div><div class="full"><button class="btn" id="addEntryBtn">記録する</button></div></div><div class="note">データはこのブラウザのlocalStorageに保存されます。実運用版は会社ごとのクラウドDBへ保存。</div></section>
<section class="card"><h2>直近の入力</h2><div class="tablewrap"><table><thead><tr><th>日付</th><th>現場</th><th>人工</th><th>人工原価</th><th>その他</th><th>メモ</th></tr></thead><tbody id="entryRows"></tbody></table></div></section>
</div><aside>
<section class="card"><h2>経営アラート</h2><div class="alerts" id="alerts"></div></section>
<section class="card"><h2>売上目標</h2><div style="color:var(--muted);font-size:12px">PRO 39,800円 × 400社</div><strong style="display:block;font-size:30px;margin-top:4px">1.91億円 / 年</strong><div class="bar"><i style="width:2.5%"></i></div><div class="note">この表示は事業モデルの目標値。収益を保証するものではありません。</div></section>
</aside></div>
</main></div>
<div class="modal" id="projectModal"><div class="modalbox"><h3>新しい現場</h3><div class="formgrid"><div class="field full"><label>現場名</label><input id="pName" placeholder="例：札幌駅前ホテル解体"></div><div class="field"><label>元請</label><input id="pClient" placeholder="元請会社名"></div><div class="field"><label>契約額</label><input id="pSales" type="number" value="1000000"></div><div class="field"><label>請求状態</label><select id="pBilling"><option value="未請求">未請求</option><option value="請求済">請求済</option><option value="入金済">入金済</option></select></div></div><div class="modalactions"><button class="btn secondary" id="cancelProject">閉じる</button><button class="btn" id="saveProject">保存</button></div></div></div>
<script>
const KEY='genba-ai-mvp-v1'; const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Math.round(n));
const today=()=>new Date().toISOString().slice(0,10);
const demo=()=>({projects:[{id:'p1',name:'札幌中央テナント解体',client:'北星建設',sales:3800000,billing:'請求済'},{id:'p2',name:'新川倉庫改修',client:'丸北工業',sales:2200000,billing:'未請求'},{id:'p3',name:'すすきの店舗原状回復',client:'道央商事',sales:1450000,billing:'入金済'}],entries:[{id:'e1',projectId:'p1',date:today(),days:62,rate:18500,other:440000,memo:'解体・搬出'},{id:'e2',projectId:'p2',date:today(),days:41,rate:18500,other:260000,memo:'夜間含む'},{id:'e3',projectId:'p3',date:today(),days:24,rate:18500,other:120000,memo:'原状回復'}]});
let state; try{state=JSON.parse(localStorage.getItem(KEY))||demo()}catch{state=demo()}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function projectCost(id){const es=state.entries.filter(e=>e.projectId===id);return es.reduce((a,e)=>a+e.days*e.rate+e.other,0)}
function projectLabor(id){return state.entries.filter(e=>e.projectId===id).reduce((a,e)=>a+e.days*e.rate,0)}
function badge(m){if(m<10)return'<span class="pill danger">危険</span>';if(m<20)return'<span class="pill warn">注意</span>';return'<span class="pill ok">健全</span>'}
function billingBadge(b){return b==='入金済'?'<span class="pill ok">入金済</span>':b==='請求済'?'<span class="pill warn">請求済</span>':'<span class="pill danger">未請求</span>'}
function render(){
 const totals=state.projects.reduce((a,p)=>{a.sales+=p.sales;a.labor+=projectLabor(p.id);a.cost+=projectCost(p.id);return a},{sales:0,labor:0,cost:0});totals.other=totals.cost-totals.labor;totals.profit=totals.sales-totals.cost;totals.margin=totals.sales?totals.profit/totals.sales*100:0;
 kSales.textContent=yen(totals.sales);kLabor.textContent=yen(totals.labor);kOther.textContent=yen(totals.other);kProfit.textContent=yen(totals.profit);kMargin.textContent=totals.margin.toFixed(1)+'%';kMargin.style.color=totals.margin<10?'var(--danger)':totals.margin<20?'var(--warn)':'var(--ok)';
 projectRows.innerHTML=state.projects.map(p=>{const c=projectCost(p.id),pr=p.sales-c,m=p.sales?pr/p.sales*100:0,days=state.entries.filter(e=>e.projectId===p.id).reduce((a,e)=>a+e.days,0);return`<tr><td><b>${esc(p.name)}</b><div>${badge(m)}</div></td><td>${esc(p.client)}</td><td>${yen(p.sales)}</td><td>${days}</td><td>${yen(c)}</td><td>${yen(pr)}</td><td>${m.toFixed(1)}%</td><td>${billingBadge(p.billing)}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">現場がありません</td></tr>';
 entryProject.innerHTML=state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
 entryRows.innerHTML=[...state.entries].reverse().slice(0,12).map(e=>{const p=state.projects.find(x=>x.id===e.projectId);return`<tr><td>${e.date}</td><td>${esc(p?.name||'削除済')}</td><td>${e.days}</td><td>${yen(e.days*e.rate)}</td><td>${yen(e.other)}</td><td>${esc(e.memo||'')}</td></tr>`}).join('');
 const al=[];state.projects.forEach(p=>{const c=projectCost(p.id),m=p.sales?(p.sales-c)/p.sales*100:0;if(m<10)al.push({t:'赤字危険',d:p.name+' の粗利率 '+m.toFixed(1)+'%',c:'danger'});else if(m<20)al.push({t:'薄利注意',d:p.name+' の粗利率 '+m.toFixed(1)+'%',c:'warn'});if(p.billing==='未請求'&&c>0)al.push({t:'未請求',d:p.name+' に原価が発生しています',c:'danger'})});if(!al.length)al.push({t:'異常なし',d:'現在の警告はありません',c:'ok'});alerts.innerHTML=al.map(a=>`<div class="alert"><b style="color:var(--${a.c})">${a.t}</b><span>${esc(a.d)}</span></div>`).join('');
}
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]))}
entryDate.value=today();
newProjectBtn.onclick=()=>projectModal.classList.add('open');cancelProject.onclick=()=>projectModal.classList.remove('open');
saveProject.onclick=()=>{if(!pName.value.trim())return alert('現場名を入力してください');state.projects.push({id:'p'+Date.now(),name:pName.value.trim(),client:pClient.value.trim(),sales:+pSales.value||0,billing:pBilling.value});pName.value='';pClient.value='';projectModal.classList.remove('open');save()};
addEntryBtn.onclick=()=>{if(!entryProject.value)return alert('現場を追加してください');state.entries.push({id:'e'+Date.now(),projectId:entryProject.value,date:entryDate.value||today(),days:+entryDays.value||0,rate:+entryRate.value||0,other:+entryOther.value||0,memo:entryMemo.value.trim()});entryDays.value=1;entryOther.value=0;entryMemo.value='';save()};
resetBtn.onclick=()=>{if(confirm('デモデータに戻しますか？')){state=demo();save()}};
exportBtn.onclick=()=>{const rows=[['現場','元請','契約売上','人工原価','総原価','粗利益','粗利率','請求状態'],...state.projects.map(p=>{const c=projectCost(p.id),l=projectLabor(p.id),pr=p.sales-c,m=p.sales?pr/p.sales*100:0;return[p.name,p.client,p.sales,l,c,pr,m.toFixed(1)+'%',p.billing]})];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='genba-ai-projects.csv';a.click();URL.revokeObjectURL(a.href)};
render();
</script>
</body></html>
