  <style>
    html,body{margin:0;width:100%;height:100%;background:#061421;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .loading{position:fixed;inset:0;display:grid;place-items:center;background:#061421;z-index:9999}
    .loading-inner{text-align:center;opacity:.86;letter-spacing:.12em}
    .loading-bar{width:min(280px,70vw);height:1px;background:rgba(255,255,255,.16);margin:18px auto 0;overflow:hidden}
    .loading-bar:after{content:"";display:block;width:40%;height:100%;background:rgba(255,255,255,.75);animation:move 1.2s ease-in-out infinite}
    @keyframes move{0%{transform:translateX(-120%)}100%{transform:translateX(350%)}}

<body>
  <div class="loading" id="loading"><div class="loading-inner">KAKU ADVERTISING OFFICE<div class="loading-bar"></div></div></div>
  <noscript>
    <main class="fallback">
      <h1>札幌のホームページ制作・Webデザイン｜加来広告事務所</h1>
      <p>札幌市北区の加来広告事務所です。ホームページ制作、Webデザイン、広告デザイン、多言語Web制作、ブランディングに対応しています。</p>
    </main>
  </noscript>
  <script>
  (async function(){
    const files = ["chunk-000.txt","chunk-001.txt","chunk-002.txt","chunk-003.txt","chunk-004.txt","chunk-005.txt","chunk-006.txt","chunk-007.txt","chunk-008.txt","chunk-009.txt","chunk-010.txt","chunk-011.txt","chunk-012.txt","chunk-013.txt","chunk-014.txt","chunk-015.txt","chunk-016.txt","chunk-017.txt","chunk-018.txt","chunk-019.txt","chunk-020.txt"];
    try{
      const base = new URL('../kaku-office-src/', location.href);
      const parts = await Promise.all(files.map(async name=>{
        const res = await fetch(new URL(name, base), {cache:'no-cache'});
        if(!res.ok) throw new Error(name + ' ' + res.status);
        return res.text();
      }));
      const html = parts.join('');
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      console.error(err);
      const loading = document.getElementById('loading');
      if(loading) loading.remove();
      document.body.insertAdjacentHTML('beforeend',
        '<main class="fallback"><h1>加来広告事務所</h1><p>サイトの読み込みに失敗しました。少し時間をおいて再読み込みしてください。</p><p>札幌市北区の広告・Web制作事務所。ホームページ制作、Webデザイン、広告デザイン、多言語Web制作に対応しています。</p></main>');
    }
  })();
  </script>
</body>
